<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>作品登録ツール</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <h1>作品登録ツール（最小構成）</h1>

  <section>
    <label><input type="checkbox" id="useSourcePath"> 画像の絶対パスを直接指定する</label>
    <div id="fileMode">
      <input type="file" id="imageFile" accept="image/*" />
      <div id="preview"></div>
    </div>
    <div id="pathMode" style="display:none">
      <input type="text" id="sourcePath" placeholder="/Volumes/外付けHDD/2026/0102ももさん/ex/IMG_0001.jpg"
        style="width:100%" />
      <p class="note">注意: このパスは読み取りのみ。元画像は変更・移動・削除しません。</p>
    </div>
  </section>

  <hr />

  <form id="metaForm">
    <p class="note">作品ID：登録日YYMMDD + モデル名（marin_minaseaoiなど） + _ + 通し番号4桁で自動生成されます</p>
    <input type="hidden" name="id" id="workId" />
    <div class="grid">
      <label>登録日
        <span id="registrationDateDisplay" class="readonly-value"></span>
      </label>
      <label>登録日YYMMDD
        <span id="registrationDatePrefix" class="readonly-value"></span>
      </label>
      <label>モデル名
        <input id="workIdModelName" required pattern="[A-Za-z0-9_]+" placeholder="minaseaoi" />
      </label>
      <label>通し番号4桁
        <input id="workIdSequence" required inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="0001" />
      </label>
      <label>作品IDプレビュー
        <span id="workIdPreview" class="readonly-value preview-value">未入力</span>
      </label>
      <label>タイトル
        <input name="title" required />
        <span id="titleDuplicateWarning" class="warning" aria-live="polite"></span>
      </label>
      <label>撮影日
        <input name="date" type="date" required />
      </label>
      <label>撮影場所
        <input name="location" list="locations" required />
        <datalist id="locations"></datalist>
      </label>
      <label>production
        <input name="production" list="productions" required />
        <datalist id="productions"></datalist>
      </label>
      <label>モデルIDs（カンマ区切り または ["momo_osakabimage","minaseaoi"]）
        <input name="modelIds" id="modelIds" required placeholder='minaseaoi,momoseyuuri' />
      </label>
    </div>

    <div class="model-picker">
      <label>モデル候補検索
        <input id="modelSearch" type="search" placeholder="表示名・モデルID・所属で検索" autocomplete="off" />
      </label>
      <div id="modelSuggestions" class="suggestions" aria-live="polite"></div>
    </div>

    <label>キャプション
      <textarea name="caption" rows="3" placeholder="光に触れるような一枚。"></textarea>
    </label>

    <div class="row">
      <label>上書き
        <select name="overwrite">
          <option value="skip" selected>安全のためスキップ</option>
          <option value="overwrite">上書きする</option>
        </select>
      </label>
      <button type="button" id="clearForm">一括クリア</button>
      <button type="submit">決定（登録）</button>
    </div>
  </form>

  <div id="result"></div>

  <script src="./main.js"></script>
</body>

</html>
