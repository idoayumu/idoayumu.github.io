name: Process pending model

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'tools/admin/uploads/models/pending/**'
      - 'tools/admin/uploads/models/replace-pending/**'

permissions:
  contents: write

concurrency:
  group: process-pending-model-dev
  cancel-in-progress: false

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process pending model
        id: process
        run: node tools/scripts/process-pending-model.cjs

      - name: Validate data
        if: steps.process.outputs.changed == 'true'
        run: npm run validate:data

      - name: Build
        if: steps.process.outputs.changed == 'true'
        run: npm run build

      - name: Commit processed model
        if: steps.process.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/images/models src/data/models.json tools/admin/public/data/models.json tools/admin/uploads/models/pending

          if [ -d tools/admin/uploads/models/replace-pending ]; then
            git add tools/admin/uploads/models/replace-pending
          fi

          git commit -m "${{ steps.process.outputs.commit_message }}"
          git push origin dev
