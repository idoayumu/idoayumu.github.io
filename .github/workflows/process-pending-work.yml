name: Process pending work

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'tools/admin/uploads/works/pending/**'

permissions:
  contents: write

concurrency:
  group: process-pending-work-dev
  cancel-in-progress: false

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process pending work
        id: process
        run: node tools/scripts/process-pending-work.cjs

      - name: Validate data
        if: steps.process.outputs.changed == 'true'
        run: npm run validate:data

      - name: Build
        if: steps.process.outputs.changed == 'true'
        run: npm run build

      - name: Commit processed work
        if: steps.process.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/works/large public/images/works/thumbs src/data/works.json tools/admin/public/data/works.json tools/admin/uploads/works/pending
          git commit -m "${{ steps.process.outputs.commit_message }}"
          git push origin dev
